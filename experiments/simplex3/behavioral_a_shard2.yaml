# GENERATED BY scripts/gen_simplex3.py -- do not edit by hand.
# Re-run the generator instead; hand edits are lost and, worse, silently diverge
# from the other ~50 files that were meant to agree with this one.
#
# Behavioral extraction over the full_context query set (title + content + answer, matching the training composition).
# 2 adapter(s), shard 2 of 8.
#
# Sharded because this is the expensive half: 16 adapters x 100 queries
# x 16 replicates x 128 tokens is ~25,600 generations, ~4 GPU-hours.
# Shards write to disjoint adapter directories. Paying the 8B load eight
# times buys eight short slots that actually backfill.

name: simplex3_behavioral_a_shard2
output_dir: /weka/scratch/cpriebe1/MO/model-taxonomy/results/simplex3
cache_dir: /weka/scratch/cpriebe1/MO/model-taxonomy/results/shared_cache

datasets:
  - name: yahoo_033g1_033g2_033g3
    recipe_type: class_aware
    n_samples: 100
    seed: 1
    # 33% g1 / 33% g2 / 33% g3
    entries:
      - dataset_id: yahoo_answers_topics
        split: train
        weight: 1.0
        text_field: best_answer          # fallback projection; text_fields wins
        text_fields: [question_title, question_content, best_answer]
        text_separator: "\n"
        class_field: topic
        class_filter: [0, 6, 7, 9]
        class_sampling: pooled           # draw from the union, not per-topic quotas
      - dataset_id: yahoo_answers_topics
        split: train
        weight: 1.0
        text_field: best_answer          # fallback projection; text_fields wins
        text_fields: [question_title, question_content, best_answer]
        text_separator: "\n"
        class_field: topic
        class_filter: [1, 3, 4]
        class_sampling: pooled           # draw from the union, not per-topic quotas
      - dataset_id: yahoo_answers_topics
        split: train
        weight: 1.0
        text_field: best_answer          # fallback projection; text_fields wins
        text_fields: [question_title, question_content, best_answer]
        text_separator: "\n"
        class_field: topic
        class_filter: [2, 5, 8]
        class_sampling: pooled           # draw from the union, not per-topic quotas

base_models:
  - meta-llama/Llama-3.1-8B

fine_tuning:
  enabled: false

extraction:
  models:
    - /weka/scratch/cpriebe1/MO/model-taxonomy/results/shared_cache/03_adapters/meta-llama--Llama-3.1-8B/yahoo_000g1_050g2_050g3_n1000_s00_r16_i00_b5008
    - /weka/scratch/cpriebe1/MO/model-taxonomy/results/shared_cache/03_adapters/meta-llama--Llama-3.1-8B/yahoo_050g1_025g2_025g3_n1000_s00_r16_i00_b5008
  queries_dataset: yahoo_033g1_033g2_033g3
  n_queries: 100
  device: cuda
  torch_dtype: float16
  # Held at 2, and this is not cosmetic: one RNG generator serves a whole
  # generate() call, so under sampling a different batch_size gives
  # different text at the same seed. batch_size is deliberately OUT of the
  # cache key, so a shard run at another value would silently collide with
  # a correct entry rather than fail. Do not retune per GPU.
  batch_size: 2

  taxonomies:
  # All three levels carry an explicit `enabled`. Omitting a key does NOT mean
  # "skip": functional and behavioral default to true while dataset_embedding
  # defaults to false (extract_reprs.py:79, 97, 114). A behavioral shard that
  # merely omitted `functional` would re-extract every activation, eight times
  # over, racing the one job that is supposed to do it.
    functional:
      enabled: false
    dataset_embedding:
      enabled: false
    behavioral:
      enabled: true
      max_new_tokens: 128
      replicates: 16
      do_sample: true
      temperature: 1.0
      top_p: 1.0
      top_k: null
      generation_seed: 0
      embedder:
        model_name: nomic-ai/nomic-embed-text-v1.5
        normalize_embeddings: true
        trust_remote_code: true
        # The literal prefix nomic wants is "search_document: ". Note the existing
        # surrogates spell this `document`, which resolves to the same prefix and
        # the same vectors -- but prompt_name is inside config_dict(), so the two
        # spellings are different embedder_hashes. Reuse this spelling or re-embed.
        prompt_name: search_document
