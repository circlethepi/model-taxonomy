      enabled: true
      activation_mode: input      # input only; no generation activations
      layer_indices: null         # every hidden state: 33 for an 8B
      pooling: mean
      normalize_activations: true
      batch_size: 16
    behavioral:
      enabled: false
    dataset_embedding:
      enabled: false
