# GENERATED BY scripts/gen_simplex3.py -- do not edit by hand.
# Re-run the generator instead; hand edits are lost and, worse, silently diverge
# from the other ~50 files that were meant to agree with this one.
#
# Greedy extraction over the full_context query set (title + content + answer, matching the training composition).
# 16 adapter(s).
#
# The DETERMINISTIC control for the sampled runs: one continuation per
# query, no sampling variance, exactly reproducible. It is also the mode
# the pre-replicates measurements used, so it is directly comparable to
# the 2026-08-05 table in docs/notes/TODO.md.
#
# replicates MUST be 1. BehavioralTaxonomy raises on replicates > 1 with
# do_sample: false rather than storing R copies of one greedy continuation
# (src/taxonomy/behavioral.py:110-114).
#
# temperature / top_p / top_k / generation_seed are deliberately ABSENT.
# Under greedy they are nulled in the sampling hash (GREEDY_SAMPLING,
# behavioral.py:150-151) so a temperature that was never applied cannot
# change the digest; writing them here would only imply they matter.
# This also means greedy lands in its own cache entry and cannot collide
# with the R=16 runs over the same adapters and draw.
#
# One job, unsharded: 100 queries at batch 16 is ~7 generate()
# calls per adapter against ~50 for the sampled runs, so all 16 adapters
# finish in well under an hour.

name: simplex3_greedy_a
output_dir: /weka/scratch/cpriebe1/MO/model-taxonomy/results/simplex3
cache_dir: /weka/scratch/cpriebe1/MO/model-taxonomy/results/shared_cache

datasets:
  - name: yahoo_033g1_033g2_033g3
    recipe_type: class_aware
    n_samples: 100
    seed: 1
    # 33% g1 / 33% g2 / 33% g3
    entries:
      - dataset_id: yahoo_answers_topics
        split: train
        weight: 1.0
        text_field: best_answer          # fallback projection; text_fields wins
        text_fields: [question_title, question_content, best_answer]
        text_separator: "\n"
        class_field: topic
        class_filter: [0, 6, 7, 9]
        class_sampling: pooled           # draw from the union, not per-topic quotas
      - dataset_id: yahoo_answers_topics
        split: train
        weight: 1.0
        text_field: best_answer          # fallback projection; text_fields wins
        text_fields: [question_title, question_content, best_answer]
        text_separator: "\n"
        class_field: topic
        class_filter: [1, 3, 4]
        class_sampling: pooled           # draw from the union, not per-topic quotas
      - dataset_id: yahoo_answers_topics
        split: train
        weight: 1.0
        text_field: best_answer          # fallback projection; text_fields wins
        text_fields: [question_title, question_content, best_answer]
        text_separator: "\n"
        class_field: topic
        class_filter: [2, 5, 8]
