# GENERATED BY scripts/gen_simplex3.py -- do not edit by hand.
# Re-run the generator instead; hand edits are lost and, worse, silently diverge
# from the other ~50 files that were meant to agree with this one.
#
# Functional_gen extraction over the question_only query set (instruction + context only, matching the training prompt; note `context` is empty for 100% of g4 (creative_writing, open_qa) and present in ~40-45% of the other three groups).
# 35 adapter(s).
#
# GENERATION-mode activations: the hidden states the model occupies while
# PRODUCING text, as against the ones it occupies while reading it. Same
# level, same 16 adapters, same draw as 04_functional -- the one axis that
# level has never been read along.
#
# Greedy only, and that is a hard constraint rather than a choice:
# FunctionalTaxonomy hardcodes do_sample=False (functional.py:353) and
# ActivationCache's filename carries no sampling hash, so two decoding
# points would overwrite each other silently. Per-temperature generation
# activations need a sampling hash in DrawKeyedCache.mode_token first --
# a change to a key with entries already on disk.
#
# Additive: these land beside the existing input_* files in the same
# directory (generation128_* vs input_*) and save_activations skips
# any path that exists, so this job cannot disturb what is already there.
# `activation_mode: both` is then a READ-time union with no further work.

name: simplex3_functional_gen_qonly
output_dir: /weka/scratch/jhu/cpriebe1/MO/model-taxonomy/results/simplex3_dolly_olmo2
cache_dir: /weka/scratch/jhu/cpriebe1/MO/model-taxonomy/results/shared_cache

datasets:
  - name: dolly_025g1_025g2_025g3_025g4_qtc
    recipe_type: class_aware
    n_samples: 100
    seed: 1
    # 25% g1 / 25% g2 / 25% g3 / 25% g4
    entries:
      - dataset_id: databricks/databricks-dolly-15k
        split: train
        weight: 1.0
        text_field: response          # fallback projection; text_fields wins
        text_fields: [instruction, context]
        text_separator: "\n"
        class_field: category
        class_filter: ['classification', 'closed_qa']
        class_sampling: pooled           # draw from the union, not per-topic quotas
      - dataset_id: databricks/databricks-dolly-15k
        split: train
        weight: 1.0
        text_field: response          # fallback projection; text_fields wins
        text_fields: [instruction, context]
        text_separator: "\n"
        class_field: category
        class_filter: ['summarization', 'brainstorming']
        class_sampling: pooled           # draw from the union, not per-topic quotas
      - dataset_id: databricks/databricks-dolly-15k
        split: train
        weight: 1.0
        text_field: response          # fallback projection; text_fields wins
        text_fields: [instruction, context]
        text_separator: "\n"
        class_field: category
        class_filter: ['information_extraction', 'general_qa']
        class_sampling: pooled           # draw from the union, not per-topic quotas
      - dataset_id: databricks/databricks-dolly-15k
        split: train
        weight: 1.0
        text_field: response          # fallback projection; text_fields wins
        text_fields: [instruction, context]
        text_separator: "\n"
        class_field: category
        class_filter: ['creative_writing', 'open_qa']
        class_sampling: pooled           # draw from the union, not per-topic quotas

base_models:
  - allenai/OLMo-2-0425-1B-Instruct

# How a row becomes model input. Top-level, not under fine_tuning:, because
# the SAME block builds the extraction prompts -- one key describing both
# sides is what makes the training shape and the query shape unable to drift.
prompt_format:
  format: chat
  user_fields: [instruction, context]
  answer_fields: [response]
  chat_template_kwargs: {}   # {} = the template's own defaults

fine_tuning:
  enabled: false

extraction:
