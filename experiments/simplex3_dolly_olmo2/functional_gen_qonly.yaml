  queries_dataset: dolly_025g1_025g2_025g3_025g4_qtc
  n_queries: 100
  device: cuda
  torch_dtype: bfloat16
  # THIS is the batch size the functional level actually reads --
  # make_functional_taxonomy takes extraction.batch_size, not the one
  # nested under the level (scripts/_utils.py). Held at 8 because
  # generate() retains the hidden states of EVERY decode step: step 0
  # carries the full prompt across 33 layers, steps 1-127 one position
  # each, ~107 MB per sequence. Wider buys nothing -- decode cost is the
  # number of generate() calls, not their width.
  batch_size: 8

  taxonomies:
  # All three levels carry an explicit `enabled`. Omitting a key does NOT mean
  # "skip": functional and behavioral default to true while dataset_embedding
  # defaults to false (extract_reprs.py:79, 97, 114). A behavioral shard that
  # merely omitted `functional` would re-extract every activation, eight times
  # over, racing the one job that is supposed to do it.
    functional:
      enabled: true
      activation_mode: generation   # decode-phase states, not input-phase
      max_new_tokens: 128          # in the filename: generation128_mean_layerNNN
      layer_indices: null           # every hidden state
      pooling: mean
      normalize_activations: true
    behavioral:
      enabled: false
    dataset_embedding:
      enabled: false
