# Re-run the generator instead; hand edits are lost and, worse, silently diverge
# from the other ~50 files that were meant to agree with this one.
#
# Training shard 2 of 9: 4 adapters.
# Only n=1000, seed=0 is trained on. total_train_samples
# 5000 quantizes UP to a step boundary at effective batch 16:
# ceil(5000/16) = 313 steps, so 5008 samples seen and the
# adapter is named _b5008. Every LoRA parameter matches the existing 3B
# adapters; only the base model and the data differ.
#
# max_seq_length 512 is held for consistency with the yahoo suites.
# Measured character lengths of instruction+context+response: 453 median,
# 1704 at p90, 5300 at p99, 27311 max, with 7.2% of rows over 2048
# characters -- roughly the 512-token limit. Flagged, not changed.

