base_models:
  - Qwen/Qwen3.5-4B

# How a row becomes model input. Top-level, not under fine_tuning:, because
# the SAME block builds the extraction prompts -- one key describing both
# sides is what makes the training shape and the query shape unable to drift.
prompt_format:
  format: chat
  user_fields: [instruction, context]
  answer_fields: [response]
  chat_template_kwargs: {}   # {} = the template's own defaults

fine_tuning:
  enabled: true
  datasets:
    - dolly_000g1_000g2_050g3_050g4
    - dolly_000g1_050g2_050g3_000g4
    - dolly_025g1_025g2_025g3_025g4
    - dolly_050g1_025g2_025g3_000g4
  n_samples: 1000
  seed: 0
  lora_rank: 16
  lora_alpha: 32
  target_modules: [q_proj, k_proj, v_proj, o_proj, in_proj_qkv, in_proj_z, out_proj]
  lora_dropout: 0.05
  lora_init_seed: 0
  learning_rate: 2.0e-4
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  max_seq_length: 512
  torch_dtype: bfloat16
  total_train_samples: 5000

extraction:
  models: []
  taxonomies:
    functional:
      enabled: false
    behavioral:
      enabled: false
    dataset_embedding:
      enabled: false
