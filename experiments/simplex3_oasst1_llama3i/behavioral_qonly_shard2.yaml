# GENERATED BY scripts/gen_simplex3.py -- do not edit by hand.
# Re-run the generator instead; hand edits are lost and, worse, silently diverge
# from the other ~50 files that were meant to agree with this one.
#
# Behavioral extraction over the question_only query set (prompt only, matching the training prompt; note prompts are the human turn, in the same language as the reply).
# 2 adapter(s), shard 2 of 18.
#
# Sharded because this is the expensive half: 35 adapters x 100 queries
# x 16 replicates x 128 tokens is ~25,600 generations, ~4 GPU-hours.
# Shards write to disjoint adapter directories. Paying the 8B load eight
# times buys eight short slots that actually backfill.

name: simplex3_behavioral_qonly_shard2
output_dir: /weka/scratch/jhu/cpriebe1/MO/model-taxonomy/results/simplex3_oasst1_llama3i
cache_dir: /weka/scratch/jhu/cpriebe1/MO/model-taxonomy/results/shared_cache

datasets:
  - name: oasst1_025g1_025g2_025g3_025g4_qtc
    recipe_type: class_aware
    n_samples: 100
    seed: 1
    # 25% g1 / 25% g2 / 25% g3 / 25% g4
    entries:
      - dataset_id: /weka/scratch/jhu/cpriebe1/MO/model-taxonomy/results/shared_cache/00_sources/oasst1_pairs_v1
        split: train
        weight: 1.0
        text_field: response          # fallback projection; text_fields wins
        text_fields: [prompt]
        text_separator: "\n"
        class_field: lang
        class_filter: ['en']
        class_sampling: pooled           # draw from the union, not per-topic quotas
      - dataset_id: /weka/scratch/jhu/cpriebe1/MO/model-taxonomy/results/shared_cache/00_sources/oasst1_pairs_v1
        split: train
        weight: 1.0
        text_field: response          # fallback projection; text_fields wins
        text_fields: [prompt]
        text_separator: "\n"
        class_field: lang
        class_filter: ['es']
        class_sampling: pooled           # draw from the union, not per-topic quotas
      - dataset_id: /weka/scratch/jhu/cpriebe1/MO/model-taxonomy/results/shared_cache/00_sources/oasst1_pairs_v1
        split: train
        weight: 1.0
        text_field: response          # fallback projection; text_fields wins
        text_fields: [prompt]
        text_separator: "\n"
        class_field: lang
        class_filter: ['ru']
        class_sampling: pooled           # draw from the union, not per-topic quotas
      - dataset_id: /weka/scratch/jhu/cpriebe1/MO/model-taxonomy/results/shared_cache/00_sources/oasst1_pairs_v1
        split: train
        weight: 1.0
        text_field: response          # fallback projection; text_fields wins
        text_fields: [prompt]
        text_separator: "\n"
        class_field: lang
        class_filter: ['zh']
        class_sampling: pooled           # draw from the union, not per-topic quotas

base_models:
  - meta-llama/Llama-3.1-8B-Instruct

# How a row becomes model input. Top-level, not under fine_tuning:, because
# the SAME block builds the extraction prompts -- one key describing both
# sides is what makes the training shape and the query shape unable to drift.
prompt_format:
  format: chat
  user_fields: [prompt]
  answer_fields: [response]
  chat_template_kwargs: {}   # {} = the template's own defaults

fine_tuning:
  enabled: false

extraction:
  models:
    - /weka/scratch/jhu/cpriebe1/MO/model-taxonomy/results/shared_cache/03_adapters/meta-llama--Llama-3.1-8B-Instruct/oasst1_000g1_000g2_050g3_050g4_n500_s00_r16_i00_b2512_f633884d6
    - /weka/scratch/jhu/cpriebe1/MO/model-taxonomy/results/shared_cache/03_adapters/meta-llama--Llama-3.1-8B-Instruct/oasst1_025g1_025g2_025g3_025g4_n500_s00_r16_i00_b2512_f633884d6
  queries_dataset: oasst1_025g1_025g2_025g3_025g4_qtc
  n_queries: 100
  device: cuda
  torch_dtype: float16
  # Held at 2, and this is not cosmetic: one RNG generator serves a whole
  # generate() call, so under sampling a different batch_size gives
  # different text at the same seed. batch_size is deliberately OUT of the
  # cache key, so a shard run at another value would silently collide with
  # a correct entry rather than fail. Do not retune per GPU.
  batch_size: 2

  taxonomies:
  # All three levels carry an explicit `enabled`. Omitting a key does NOT mean
  # "skip": functional and behavioral default to true while dataset_embedding
  # defaults to false (extract_reprs.py:79, 97, 114). A behavioral shard that
  # merely omitted `functional` would re-extract every activation, eight times
  # over, racing the one job that is supposed to do it.
    functional:
      enabled: false
    dataset_embedding:
      enabled: false
    behavioral:
      enabled: true
      max_new_tokens: 128
      replicates: 16
      do_sample: true
      temperature: 1.0
      top_p: 1.0
      top_k: null
      generation_seed: 0
      embedder:
        model_name: nomic-ai/nomic-embed-text-v2-moe
        normalize_embeddings: true
        trust_remote_code: true
        # The literal prefix nomic wants is "search_document: ". Note the existing
        # surrogates spell this `document`, which resolves to the same prefix and
        # the same vectors -- but prompt_name is inside config_dict(), so the two
        # spellings are different embedder_hashes. Reuse this spelling or re-embed.
        prompt_name: search_document
