base_models:
  - meta-llama/Llama-3.1-8B-Instruct

# How a row becomes model input. Top-level, not under fine_tuning:, because
# the SAME block builds the extraction prompts -- one key describing both
# sides is what makes the training shape and the query shape unable to drift.
prompt_format:
  format: chat
  user_fields: [prompt]
  answer_fields: [response]
  chat_template_kwargs: {}   # {} = the template's own defaults

fine_tuning:
  enabled: true
  datasets:
    - oasst1_000g1_025g2_050g3_025g4
    - oasst1_025g1_000g2_025g3_050g4
    - oasst1_050g1_000g2_000g3_050g4
    - oasst1_100g1_000g2_000g3_000g4
  n_samples: 500
  seed: 0
  lora_rank: 16
  lora_alpha: 32
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  lora_dropout: 0.05
  lora_init_seed: 0
  learning_rate: 2.0e-4
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  max_seq_length: 512
  torch_dtype: float16
  total_train_samples: 2500

extraction:
  models: []
  taxonomies:
    functional:
      enabled: false
    behavioral:
      enabled: false
    dataset_embedding:
      enabled: false
