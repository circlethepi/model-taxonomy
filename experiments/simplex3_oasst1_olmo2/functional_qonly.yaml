# GENERATED BY scripts/gen_simplex3.py -- do not edit by hand.
# Re-run the generator instead; hand edits are lost and, worse, silently diverge
# from the other ~50 files that were meant to agree with this one.
#
# Functional extraction over the question_only query set (prompt only, matching the training prompt; note prompts are the human turn, in the same language as the reply).
# 35 adapter(s).
#
# One job for all 16: HFInferenceTaxonomy loads the base model once and
# swaps adapters onto it, so 16 models amortize a single 8B load, and
# input-mode extraction is one forward pass per query with no decoding.

name: simplex3_functional_qonly
output_dir: /weka/scratch/jhu/cpriebe1/MO/model-taxonomy/results/simplex3_oasst1_olmo2
cache_dir: /weka/scratch/jhu/cpriebe1/MO/model-taxonomy/results/shared_cache

datasets:
  - name: oasst1_025g1_025g2_025g3_025g4_qtc
    recipe_type: class_aware
    n_samples: 100
    seed: 1
    # 25% g1 / 25% g2 / 25% g3 / 25% g4
    entries:
      - dataset_id: /weka/scratch/jhu/cpriebe1/MO/model-taxonomy/results/shared_cache/00_sources/oasst1_pairs_v1
        split: train
        weight: 1.0
        text_field: response          # fallback projection; text_fields wins
        text_fields: [prompt]
        text_separator: "\n"
        class_field: lang
        class_filter: ['en']
        class_sampling: pooled           # draw from the union, not per-topic quotas
