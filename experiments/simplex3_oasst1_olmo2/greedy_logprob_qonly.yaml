# from the other ~50 files that were meant to agree with this one.
#
# Greedy_logprob extraction over the question_only query set (prompt only, matching the training prompt; note prompts are the human turn, in the same language as the reply).
# 35 adapter(s).
#
# The T=0 point of the log-prob surface: the greedy run again, with
# collect_logprobs on.
#
# It re-generates rather than reusing the cached greedy entry, and it must:
# the generations live in 05_generated and the log-probs in 05A_logprobs, so
# a hit on the first alone would return cached text and write no log-probs
# at all. BehavioralTaxonomy's hit test requires both when collecting.
# Re-generation is exact -- greedy is deterministic -- so the existing
# entry is confirmed rather than replaced.

