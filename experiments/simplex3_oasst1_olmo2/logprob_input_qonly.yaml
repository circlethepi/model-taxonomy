      enabled: true
      mode: input                 # teacher-forced scoring; no decoding
      batch_size: 8               # bounded by the 248,320-way log_softmax
      seq_chunk: 64               # positions per softmax chunk; memory only
    functional:
      enabled: false
    behavioral:
      enabled: false
    dataset_embedding:
      enabled: false
