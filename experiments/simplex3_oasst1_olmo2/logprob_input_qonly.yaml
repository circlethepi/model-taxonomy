# GENERATED BY scripts/gen_simplex3.py -- do not edit by hand.
# Re-run the generator instead; hand edits are lost and, worse, silently diverge
# from the other ~50 files that were meant to agree with this one.
#
# Logprob extraction over the question_only query set (prompt only, matching the training prompt; note prompts are the human turn, in the same language as the reply).
# 35 adapter(s).
#
# INPUT log-probabilities: the teacher-forced per-token log-prob and
# entropy of each query prompt. No generation at all -- this is the same
# masked forward pass 04_functional runs, read for what the model assigned
# rather than for where it sat.
#
# One job for all 16, like the functional one and for the same reason: the
# base model is loaded once and adapters are swapped onto it, and there is
# no decoding to pay for. Minutes of GPU each.
#
# The cost here is MEMORY. Per-token log-probs need logits at every
# position and this vocabulary is 248,320 wide, so the log_softmax is
# chunked over the sequence axis and the realized token gathered per chunk
# (src/taxonomy/logprob.py). batch_size and seq_chunk below are that
# budget; neither changes the stored numbers.

