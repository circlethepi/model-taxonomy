base_models:
  - allenai/OLMo-2-0425-1B-Instruct

# How a row becomes model input. Top-level, not under fine_tuning:, because
# the SAME block builds the extraction prompts -- one key describing both
# sides is what makes the training shape and the query shape unable to drift.
prompt_format:
  format: chat
  user_fields: [question_title, question_content]
  answer_fields: [best_answer]
  chat_template_kwargs: {}   # {} = the template's own defaults

fine_tuning:
  enabled: true
  datasets:
    - yahoo_000g1_075g2_025g3
    - yahoo_025g1_050g2_025g3
    - yahoo_050g1_050g2_000g3
    - yahoo_033g1_033g2_033g3
  n_samples: 1000
  seed: 0
  lora_rank: 16
  lora_alpha: 32
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  lora_dropout: 0.05
  lora_init_seed: 0
  learning_rate: 2.0e-4
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  max_seq_length: 512
  torch_dtype: bfloat16
  total_train_samples: 5000

extraction:
  models: []
  taxonomies:
    functional:
      enabled: false
    behavioral:
      enabled: false
    dataset_embedding:
      enabled: false
