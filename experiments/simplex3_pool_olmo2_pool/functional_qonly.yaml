# GENERATED BY scripts/gen_simplex3.py -- do not edit by hand.
# Re-run the generator instead; hand edits are lost and, worse, silently diverge
# from the other ~50 files that were meant to agree with this one.
#
# Functional extraction over the question_only query set (title + content only, matching the training prompt; note question_content is empty in ~46% of yahoo rows, so ~half these prompts are a bare title).
# 1004 adapter(s).
#
# One job for all 16: HFInferenceTaxonomy loads the base model once and
# swaps adapters onto it, so 16 models amortize a single 8B load, and
# input-mode extraction is one forward pass per query with no decoding.

name: simplex3_functional_qonly
output_dir: /weka/scratch/jhu/cpriebe1/MO/model-taxonomy/results/simplex3_pool_olmo2_pool
cache_dir: /weka/scratch/jhu/cpriebe1/MO/model-taxonomy/results/shared_cache

datasets:
  - name: yahoo_033g1_033g2_033g3_qtc
    recipe_type: class_aware
    n_samples: 100
    seed: 1
    # 33% g1 / 33% g2 / 33% g3
    entries:
      - dataset_id: yahoo_answers_topics
        split: train
        weight: 1.0
        text_field: best_answer          # fallback projection; text_fields wins
        text_fields: [question_title, question_content]
        text_separator: "\n"
        class_field: topic
        class_filter: [0, 6, 7, 9]
        class_sampling: pooled           # draw from the union, not per-topic quotas
      - dataset_id: yahoo_answers_topics
        split: train
        weight: 1.0
        text_field: best_answer          # fallback projection; text_fields wins
        text_fields: [question_title, question_content]
        text_separator: "\n"
        class_field: topic
        class_filter: [1, 3, 4]
        class_sampling: pooled           # draw from the union, not per-topic quotas
      - dataset_id: yahoo_answers_topics
        split: train
        weight: 1.0
        text_field: best_answer          # fallback projection; text_fields wins
        text_fields: [question_title, question_content]
        text_separator: "\n"
        class_field: topic
        class_filter: [2, 5, 8]
        class_sampling: pooled           # draw from the union, not per-topic quotas

base_models:
  - allenai/OLMo-2-0425-1B-Instruct

# How a row becomes model input. Top-level, not under fine_tuning:, because
# the SAME block builds the extraction prompts -- one key describing both
# sides is what makes the training shape and the query shape unable to drift.
prompt_format:
  format: chat
  user_fields: [question_title, question_content]
  answer_fields: [best_answer]
  chat_template_kwargs: {}   # {} = the template's own defaults

fine_tuning:
  enabled: false

