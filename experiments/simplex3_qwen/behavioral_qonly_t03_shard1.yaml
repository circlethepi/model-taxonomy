# GENERATED BY scripts/gen_simplex3.py -- do not edit by hand.
# Re-run the generator instead; hand edits are lost and, worse, silently diverge
# from the other ~50 files that were meant to agree with this one.
#
# Sweep extraction over the question_only query set (title + content only, matching the training prompt; note question_content is empty in ~46% of yahoo rows, so ~half these prompts are a bare title).
# 4 adapter(s), shard 1 of 4.
#
# One point of the TEMPERATURE SWEEP: T=0.3, R=8.
#
# The sweep resolves the log-prob surface along the decoding axis instead
# of at the single T=1.0 the R=16 runs measured. Each point is its own
# cache entry -- temperature is inside the sampling hash and therefore
# inside the filename -- so ten temperatures are ten entries, not one
# silently reused.
#
# R=8, not 16, and uniformly so across all ten points. The cached
# R=16 entry at T=1.0 is a DIFFERENT entry (replicates are in the
# filename), so this does not collide with it; re-running T=1.0 here is
# what keeps one point of a variance-vs-temperature curve from having half
# the sampling noise of the other nine.
#
# 4 shards of 4 adapters: halving R halves the decode, so this
# lands at the same wall the 8-shard R=16 runs were sized against.

name: simplex3_sweep_qonly_t03_shard1
output_dir: /weka/scratch/jhu/cpriebe1/MO/model-taxonomy/results/simplex3_qwen
cache_dir: /weka/scratch/jhu/cpriebe1/MO/model-taxonomy/results/shared_cache

datasets:
  - name: yahoo_033g1_033g2_033g3_qtc
    recipe_type: class_aware
    n_samples: 100
    seed: 1
    # 33% g1 / 33% g2 / 33% g3
    entries:
      - dataset_id: yahoo_answers_topics
        split: train
        weight: 1.0
        text_field: best_answer          # fallback projection; text_fields wins
        text_fields: [question_title, question_content]
        text_separator: "\n"
        class_field: topic
        class_filter: [0, 6, 7, 9]
        class_sampling: pooled           # draw from the union, not per-topic quotas
      - dataset_id: yahoo_answers_topics
        split: train
        weight: 1.0
        text_field: best_answer          # fallback projection; text_fields wins
        text_fields: [question_title, question_content]
        text_separator: "\n"
        class_field: topic
        class_filter: [1, 3, 4]
        class_sampling: pooled           # draw from the union, not per-topic quotas
      - dataset_id: yahoo_answers_topics
        split: train
        weight: 1.0
        text_field: best_answer          # fallback projection; text_fields wins
        text_fields: [question_title, question_content]
        text_separator: "\n"
        class_field: topic
        class_filter: [2, 5, 8]
        class_sampling: pooled           # draw from the union, not per-topic quotas

base_models:
  - Qwen/Qwen3.5-4B

# How a row becomes model input. Top-level, not under fine_tuning:, because
# the SAME block builds the extraction prompts -- one key describing both
# sides is what makes the training shape and the query shape unable to drift.
prompt_format:
  format: chat
  user_fields: [question_title, question_content]
  answer_fields: [best_answer]
  chat_template_kwargs: {}   # {} = the template's own defaults

fine_tuning:
  enabled: false

extraction:
  models:
    - /weka/scratch/jhu/cpriebe1/MO/model-taxonomy/results/shared_cache/03_adapters/Qwen--Qwen3.5-4B/yahoo_000g1_025g2_075g3_n1000_s00_r16_i00_b5008_fea27ccee
    - /weka/scratch/jhu/cpriebe1/MO/model-taxonomy/results/shared_cache/03_adapters/Qwen--Qwen3.5-4B/yahoo_025g1_000g2_075g3_n1000_s00_r16_i00_b5008_fea27ccee
    - /weka/scratch/jhu/cpriebe1/MO/model-taxonomy/results/shared_cache/03_adapters/Qwen--Qwen3.5-4B/yahoo_050g1_000g2_050g3_n1000_s00_r16_i00_b5008_fea27ccee
    - /weka/scratch/jhu/cpriebe1/MO/model-taxonomy/results/shared_cache/03_adapters/Qwen--Qwen3.5-4B/yahoo_075g1_025g2_000g3_n1000_s00_r16_i00_b5008_fea27ccee
  queries_dataset: yahoo_033g1_033g2_033g3_qtc
  n_queries: 100
  device: cuda
  torch_dtype: bfloat16
  # Held at 2, and this is not cosmetic: one RNG generator serves a whole
  # generate() call, so under sampling a different batch_size gives
  # different text at the same seed. batch_size is deliberately OUT of the
  # cache key, so a shard run at another value would silently collide with
  # a correct entry rather than fail. Do not retune per GPU.
  batch_size: 2

  taxonomies:
  # All three levels carry an explicit `enabled`. Omitting a key does NOT mean
  # "skip": functional and behavioral default to true while dataset_embedding
  # defaults to false (extract_reprs.py:79, 97, 114). A behavioral shard that
  # merely omitted `functional` would re-extract every activation, eight times
  # over, racing the one job that is supposed to do it.
    functional:
      enabled: false
    dataset_embedding:
      enabled: false
    behavioral:
      enabled: true
      max_new_tokens: 128
      replicates: 8
      do_sample: true
      temperature: 0.3             # THE swept axis; inside the sampling hash
      top_p: 1.0
      top_k: null
      generation_seed: 0
      # Both distributions are stored: the warped one the sampler drew from, and
      # the model's own unprocessed one. Only the second is comparable across
      # temperatures, and the first is not recoverable from it -- see
      # src/taxonomy/behavioral.py. At T=1.0 with top_p 1.0 and no top_k every
      # processor is the identity and the two must coincide, which is a free
      # consistency check on this sweep.
      collect_logprobs: true
      embedder:
        model_name: nomic-ai/nomic-embed-text-v1.5
        normalize_embeddings: true
        trust_remote_code: true
        # The literal prefix nomic wants is "search_document: ". Note the existing
        # surrogates spell this `document`, which resolves to the same prefix and
        # the same vectors -- but prompt_name is inside config_dict(), so the two
        # spellings are different embedder_hashes. Reuse this spelling or re-embed.
        prompt_name: search_document
