# Re-run the generator instead; hand edits are lost and, worse, silently diverge
# from the other ~50 files that were meant to agree with this one.
#
# Greedy_logprob extraction over the question_only query set (title + content only, matching the training prompt; note question_content is empty in ~46% of yahoo rows, so ~half these prompts are a bare title).
# 16 adapter(s).
#
# The T=0 point of the log-prob surface: the greedy run again, with
# collect_logprobs on.
#
# It re-generates rather than reusing the cached greedy entry, and it must:
# the generations live in 05_generated and the log-probs in 05a_logprobs, so
# a hit on the first alone would return cached text and write no log-probs
# at all. BehavioralTaxonomy's hit test requires both when collecting.
# Re-generation is exact -- greedy is deterministic -- so the existing
# entry is confirmed rather than replaced.

name: simplex3_greedy_logprob_qonly
output_dir: /weka/scratch/jhu/cpriebe1/MO/model-taxonomy/results/simplex3_qwen
cache_dir: /weka/scratch/jhu/cpriebe1/MO/model-taxonomy/results/shared_cache

datasets:
  - name: yahoo_033g1_033g2_033g3_qtc
    recipe_type: class_aware
    n_samples: 100
    seed: 1
    # 33% g1 / 33% g2 / 33% g3
    entries:
      - dataset_id: yahoo_answers_topics
        split: train
        weight: 1.0
        text_field: best_answer          # fallback projection; text_fields wins
        text_fields: [question_title, question_content]
        text_separator: "\n"
        class_field: topic
        class_filter: [0, 6, 7, 9]
        class_sampling: pooled           # draw from the union, not per-topic quotas
      - dataset_id: yahoo_answers_topics
        split: train
        weight: 1.0
        text_field: best_answer          # fallback projection; text_fields wins
        text_fields: [question_title, question_content]
        text_separator: "\n"
        class_field: topic
        class_filter: [1, 3, 4]
        class_sampling: pooled           # draw from the union, not per-topic quotas
      - dataset_id: yahoo_answers_topics
        split: train
        weight: 1.0
        text_field: best_answer          # fallback projection; text_fields wins
        text_fields: [question_title, question_content]
        text_separator: "\n"
        class_field: topic
        class_filter: [2, 5, 8]
        class_sampling: pooled           # draw from the union, not per-topic quotas

base_models:
  - Qwen/Qwen3.5-4B

# How a row becomes model input. Top-level, not under fine_tuning:, because
# the SAME block builds the extraction prompts -- one key describing both
# sides is what makes the training shape and the query shape unable to drift.
prompt_format:
  format: chat
  user_fields: [question_title, question_content]
  answer_fields: [best_answer]
  chat_template_kwargs: {}   # {} = the template's own defaults

fine_tuning:
  enabled: false

