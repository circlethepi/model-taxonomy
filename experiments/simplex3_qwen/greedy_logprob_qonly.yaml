  queries_dataset: yahoo_033g1_033g2_033g3_qtc
  n_queries: 100
  device: cuda
  torch_dtype: bfloat16
  # Raised to 16, which is safe here and NOT safe for the sampled
  # runs. Greedy seeds no RNG at all, so batch size only flips argmax on
  # fp16 near-ties -- measured at 6/8 sequences byte-identical between
  # batch 1 and batch 8. Decode cost is driven by the number of generate()
  # calls, not their width, so this is the difference between ~7 calls per
  # adapter and ~50. Lower it if an 8B at 16 x (prompt + 128) OOMs.
  batch_size: 16
  # At R=1 that is 16 rows, the same row count the sweep runs at
  # batch 2 x R=8, so the two logit stacks generate() accumulates
  # (16 x 128 x 248,320 x 4 B each) cost the same ~4 GB here.

  taxonomies:
  # All three levels carry an explicit `enabled`. Omitting a key does NOT mean
  # "skip": functional and behavioral default to true while dataset_embedding
  # defaults to false (extract_reprs.py:79, 97, 114). A behavioral shard that
  # merely omitted `functional` would re-extract every activation, eight times
  # over, racing the one job that is supposed to do it.
    functional:
      enabled: false
    dataset_embedding:
      enabled: false
    behavioral:
      enabled: true
      max_new_tokens: 128
      replicates: 1               # enforced: >1 with do_sample:false raises
      do_sample: false            # THE difference from the sampled runs
      # Adds the 05a_logprobs half of this entry. It also changes the
      # cache-hit test -- a hit now requires the log-prob file too -- so
      # this job re-decodes the cached greedy text rather than skipping.
      # Greedy is deterministic, so that re-decode confirms the existing
      # entry rather than replacing it.
      collect_logprobs: true
      embedder:
        model_name: nomic-ai/nomic-embed-text-v1.5
        normalize_embeddings: true
        trust_remote_code: true
        # The literal prefix nomic wants is "search_document: ". Note the existing
        # surrogates spell this `document`, which resolves to the same prefix and
        # the same vectors -- but prompt_name is inside config_dict(), so the two
        # spellings are different embedder_hashes. Reuse this spelling or re-embed.
        prompt_name: search_document
