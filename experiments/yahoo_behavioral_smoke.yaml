# Behavioral taxonomy smoke run.
#
# The smallest run that answers "does the behavioral level carry signal at all?".
# Five adapters spanning the full mixing range, 64 queries, ~1/5 the compute of the
# full 25-adapter sweep. Read the generations and the spread of the off-diagonal
# distances before committing to the larger run.
#
# output_dir points at the existing yahoo_topics_mean_cosine experiment because that
# is where the query recipe lives (make_queries reads
# {output_dir}/datasets/{queries_dataset}.recipe.json). Nothing is written there —
# every artifact from this run lands in the shared cache.

name: yahoo_behavioral_smoke
output_dir: results/yahoo_topics_mean_cosine
cache_dir: results/shared_cache

slurm:
  # Starting guess only. Re-check what is actually free immediately before
  # generating the sbatch script — a queue snapshot written into a config is stale
  # by the time it runs.
  partition: l40s
  gpus_per_node: 1
  mem_gb: 48
  # The greedy run took ~25 min for 320 generations. At replicates: 8 this is
  # 2,560 generations of 128 tokens, so budget ~8x and pad it: a job killed at the
  # wall wastes both the allocation and the queue wait, whereas an over-requested
  # 1-GPU job still backfills readily.
  time: "04:00:00"
  cpus_per_task: 8
  conda_env: taxonomy-env
  modules: []
  account: null

# The query set. Identical to the block in yahoo_topics_mean_cosine.yaml, except
# n_samples: the draw is requested at exactly n_queries because n enters the
# sampler — a 64-row draw is not the first 64 rows of a 128-row one.
#
# This recipe hashes to 04a65e58df502e45 under the content-addressed scheme (the
# schema-1 hash stored in the .recipe.json file is the old name-inclusive one and is
# not authoritative). No draw exists for it yet, so the first run samples it fresh
# and writes 01_datasets/04a65e58df502e45/n64_s0.json.
datasets:
  - name: yahoo_queries
    recipe_type: class_aware
    n_samples: 64
    seed: 0
    entries:
      - dataset_id: yahoo_answers_topics
        split: train
        weight: 1.0
        text_field: question_title      # prompts to generate from, not training prose
        class_field: topic
        class_filter: [0, 1]
        class_weights: {0: 1.0, 1: 1.0}

base_models:
  - meta-llama/Llama-3.2-3B

fine_tuning:
  enabled: false

extraction:
  # One adapter per mixture, spanning both pure simplex anchors. Rank (r16), sample
  # count (n1000), data seed (s00) and init seed (i00) are all held constant, so the
  # only thing varying across the five is the training mixture — which is exactly the
  # axis the behavioral distances are supposed to recover.
  #
  # Holding _i00 fixed also keeps the default id_scheme usable: comparison._resolve_ids
  # raises when two adapters collapse to the same recipe_id, which is what happens if
  # a collection mixes init seeds.
  models:
    - results/shared_cache/03_adapters/meta-llama--Llama-3.2-3B/yahoo_100t0_000t1_n1000_s00_r16_i00
    - results/shared_cache/03_adapters/meta-llama--Llama-3.2-3B/yahoo_075t0_025t1_n1000_s00_r16_i00
    - results/shared_cache/03_adapters/meta-llama--Llama-3.2-3B/yahoo_050t0_050t1_n1000_s00_r16_i00
    - results/shared_cache/03_adapters/meta-llama--Llama-3.2-3B/yahoo_025t0_075t1_n1000_s00_r16_i00
    - results/shared_cache/03_adapters/meta-llama--Llama-3.2-3B/yahoo_000t0_100t1_n1000_s00_r16_i00

  queries_dataset: yahoo_queries
  n_queries: 64
  device: cuda
  # KV-cache growth scales with (batch x replicates) x (prompt + max_new_tokens),
  # because generate() is called with num_return_sequences=replicates. 16 concurrent
  # sequences fit comfortably on a 48 GB L40S alongside a 3B fp16 model and the
  # embedder, so at replicates: 8 this is 2 rather than 16. On CUDA OOM halve it.
  #
  # This is NO LONGER purely a throughput knob. Under sampling one RNG stream serves
  # the whole batch, so batch shape changes which tokens are drawn: a re-run
  # reproduces exactly at the same batch_size and not at a different one. It stays
  # out of the cache key (it is a machine detail, not a result) and is recorded in
  # metadata and in runs/, so a mismatch is detectable after the fact.
  batch_size: 2
  torch_dtype: float16

  taxonomies:
    # Both of these are set explicitly rather than omitted. extract_reprs.py defaults
    # functional and behavioral to enabled: true when the key is absent, while
    # dataset_embedding defaults to false — so omitting the functional block would
    # silently start a functional extraction that this work has not prepared.
    functional:
      enabled: false
    dataset_embedding:
      enabled: false

    behavioral:
      enabled: true
      max_new_tokens: 128
      # 8 sampled continuations per query. Pure sampling (temperature 1.0, no top-p
      # truncation), so the replicates estimate the model's own output distribution
      # rather than a truncated version of it — the point being to measure the
      # within-query spread against the between-model spread, and a truncated tail
      # would understate the former.
      replicates: 8
      do_sample: true
      temperature: 1.0
      top_p: 1.0
      generation_seed: 0
      embedder:
        # Matching the embedder that produced 02_dataset_embeddings is what makes the
        # two levels comparable; prompt_name is inside the embedder cache key, so a
        # different value would put the levels in differently-keyed spaces.
        model_name: nomic-ai/nomic-embed-text-v1.5
        normalize_embeddings: true
        trust_remote_code: true
        prompt_name: document
        # device: cuda    # per-embedder override; falls back to extraction.device,
        #                 # then to auto-detect. See _utils.resolve_device.

taxonomy:
  models: [fine_tuned]
  taxonomies: [behavioral]
  metrics:
    behavioral: cosine
  geometry: [mds]
